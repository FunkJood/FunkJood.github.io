<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>send</title>
<script>
addEventListener('message', async e => {
  if (e.origin !== 'https://appstoreconnect.apple.com' || !e.data || !e.data.want) return;
  for (const name of e.data.want) {
    const r = await fetch(name);
    const buf = await r.arrayBuffer();
    e.source.postMessage({ name, buf }, e.origin, [buf]);
  }
});
parent.postMessage({ ready: true }, 'https://appstoreconnect.apple.com');
</script>
